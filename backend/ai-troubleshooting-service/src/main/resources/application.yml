server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: ai-troubleshooting-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb+srv://devicecare_admin:admin1234@cluster0.sfssdaq.mongodb.net/troubleshooting_db?retryWrites=true&w=majority&appName=Cluster0&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000}
  rabbitmq:
    listener:
      simple:
        auto-startup: false

logging:
  level:
    root: INFO
    org.springframework.boot.web.embedded.tomcat: INFO
    org.springframework.boot.context.embedded: INFO
    org.springframework.data.mongodb: INFO
    com.devicecare360.aitroubleshooting: INFO

gemini:
  api:
    key: ${GEMINI_API_KEY:}

eureka:
  instance:
    prefer-ip-address: true
    hostname: ${RENDER_EXTERNAL_HOSTNAME:${HOSTNAME:localhost}}
    instance-id: ${HOSTNAME:ai-troubleshooting-service}:${spring.application.name}:${server.port}
    non-secure-port: ${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:https://device-care-360-discovery-service.onrender.com/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info