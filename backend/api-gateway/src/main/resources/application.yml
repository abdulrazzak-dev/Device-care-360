server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: https://device-care-360-auth-service.onrender.com
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: https://device-care-360-user-service.onrender.com
          predicates:
            - Path=/api/users/**
          filters:
            - AuthenticationFilter

        - id: device-brands-public
          uri: https://device-care-360-device-service.onrender.com
          predicates:
            - Path=/api/devices/brands
            - Method=GET

        - id: device-issues-public
          uri: https://device-care-360-device-service.onrender.com
          predicates:
            - Path=/api/devices/issues
            - Method=GET

        - id: device-categories-public
          uri: https://device-care-360-device-service.onrender.com
          predicates:
            - Path=/api/devices/categories
            - Method=GET

        - id: device-service-protected
          uri: https://device-care-360-device-service.onrender.com
          predicates:
            - Path=/api/devices/**
          filters:
            - AuthenticationFilter

        - id: ai-troubleshooting-service
          uri: https://device-care-360-ai-troubleshooting-service.onrender.com
          predicates:
            - Path=/api/troubleshooting/**, /api/troubleshoot/**, /api/diagnose/**, /api/ai/**, /api/analyze/**

        - id: repair-guide-service
          uri: https://device-care-360-repair-guide-service.onrender.com
          predicates:
            - Path=/api/repair-guides/**

        - id: technician-service
          uri: https://device-care-360-technician-service.onrender.com
          predicates:
            - Path=/api/technicians/**

        - id: booking-service
          uri: https://device-care-360-booking-service.onrender.com
          predicates:
            - Path=/api/bookings/**
          filters:
            - AuthenticationFilter

        - id: payment-service
          uri: https://device-care-360-payment-service.onrender.com
          predicates:
            - Path=/api/payments/**
          filters:
            - AuthenticationFilter

        - id: review-service
          uri: https://device-care-360-review-service.onrender.com
          predicates:
            - Path=/api/reviews/**

        - id: notification-service
          uri: https://device-care-360-notification-service.onrender.com
          predicates:
            - Path=/api/notifications/**
          filters:
            - AuthenticationFilter

        - id: admin-service
          uri: https://device-care-360-admin-service.onrender.com
          predicates:
            - Path=/api/admin/**
          filters:
            - AuthenticationFilter

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_HOST:device-care-360.railway.internal}:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: ${RAILWAY_PRIVATE_DOMAIN:${HOSTNAME:localhost}}
    instance-id: ${HOSTNAME:api-gateway}:${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.web.cors: DEBUG
    com.devicecare360.apigateway: DEBUG