server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: http://auth-service.railway.internal:8080
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: https://device-care-360-user-service.onrender.com:8082
          predicates:
            - Path=/api/users/**
          filters:
            - AuthenticationFilter

        - id: device-service
          uri: https://device-care-360-device-service.onrender.com:8083
          predicates:
            - Path=/api/devices/**
          filters:
            - AuthenticationFilter

        - id: ai-troubleshooting-service
          uri: ai-troubleshooting-service.railway.internal:8084
          predicates:
            - Path=/api/troubleshooting/**, /api/troubleshoot/**, /api/diagnose/**, /api/ai/**

        - id: repair-guide-service
          uri: lb://REPAIR-GUIDE-SERVICE
          predicates:
            - Path=/api/repair-guides/**

        - id: technician-service
          uri: https://device-care-360-technician-service.onrender.com:8086
          predicates:
            - Path=/api/technicians/**

        - id: booking-service
          uri: https://device-care-360-booking-service.onrender.com:8087
          predicates:
            - Path=/api/bookings/**
          filters:
            - AuthenticationFilter

        - id: payment-service
          uri: https://device-care-360-payment-service.onrender.com:8088
          predicates:
            - Path=/api/payments/**
          filters:
            - AuthenticationFilter

        - id: review-service
          uri: https://device-care-360-review-service.onrender.com:8089
          predicates:
            - Path=/api/reviews/**

        - id: notification-service
          uri: https://device-care-360-notification-service.onrender.com:8090
          predicates:
            - Path=/api/notifications/**
          filters:
            - AuthenticationFilter

        - id: admin-service
          uri: https://device-care-360-admin-service.onrender.com:8091
          predicates:
            - Path=/api/admin/**
          filters:
            - AuthenticationFilter

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_HOST:device-care-360.railway.internal}:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: ${RAILWAY_PRIVATE_DOMAIN:${HOSTNAME:localhost}}
    instance-id: ${HOSTNAME:api-gateway}:${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.web.cors: DEBUG
    com.devicecare360.apigateway: DEBUG