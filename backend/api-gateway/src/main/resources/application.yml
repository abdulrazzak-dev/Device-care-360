server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      httpclient:
        connect-timeout: 30000
        response-timeout: 90s
        pool:
          type: ELASTIC
          max-idle-time: 15s
          max-life-time: 60s
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:https://device-care-360-auth-service.onrender.com}
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: ${USER_SERVICE_URL:https://device-care-360-user-service.onrender.com}
          predicates:
            - Path=/api/users/**
          filters:
            - AuthenticationFilter

        - id: device-brands-public
          uri: ${DEVICE_SERVICE_URL:https://device-care-360-device-service.onrender.com}
          predicates:
            - Path=/api/devices/brands
            - Method=GET

        - id: device-issues-public
          uri: ${DEVICE_SERVICE_URL:https://device-care-360-device-service.onrender.com}
          predicates:
            - Path=/api/devices/issues
            - Method=GET

        - id: device-categories-public
          uri: ${DEVICE_SERVICE_URL:https://device-care-360-device-service.onrender.com}
          predicates:
            - Path=/api/devices/categories
            - Method=GET

        - id: device-service-protected
          uri: ${DEVICE_SERVICE_URL:https://device-care-360-device-service.onrender.com}
          predicates:
            - Path=/api/devices/**
          filters:
            - AuthenticationFilter

        - id: ai-troubleshooting-service
          uri: ${AI_TROUBLESHOOTING_SERVICE_URL:https://device-care-360-ai-troubleshooting.onrender.com}
          predicates:
            - Path=/api/troubleshooting/**

        - id: ai-troubleshooting-diagnose-alias
          uri: ${AI_TROUBLESHOOTING_SERVICE_URL:https://device-care-360-ai-troubleshooting.onrender.com}
          predicates:
            - Path=/api/diagnose/**
          filters:
            - RewritePath=/api/diagnose/(?<segment>.*), /api/troubleshooting/$\{segment}

        - id: ai-troubleshooting-troubleshoot-alias
          uri: ${AI_TROUBLESHOOTING_SERVICE_URL:https://device-care-360-ai-troubleshooting.onrender.com}
          predicates:
            - Path=/api/troubleshoot/**
          filters:
            - RewritePath=/api/troubleshoot/(?<segment>.*), /api/troubleshooting/$\{segment}

        - id: repair-guide-service
          uri: ${REPAIR_GUIDE_SERVICE_URL:https://device-care-360-repair-guide-service.onrender.com}
          predicates:
            - Path=/api/repair-guides/**

        - id: technician-service
          uri: ${TECHNICIAN_SERVICE_URL:https://device-care-360-technician-service.onrender.com}
          predicates:
            - Path=/api/technicians/**

        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:https://device-care-360-booking-service.onrender.com}
          predicates:
            - Path=/api/bookings/**
          filters:
            - AuthenticationFilter

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:https://device-care-360-payment-service.onrender.com}
          predicates:
            - Path=/api/payments/**
          filters:
            - AuthenticationFilter

        - id: review-service
          uri: ${REVIEW_SERVICE_URL:https://device-care-360-review-service.onrender.com}
          predicates:
            - Path=/api/reviews/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:https://device-care-360-notification-service.onrender.com}
          predicates:
            - Path=/api/notifications/**
          filters:
            - AuthenticationFilter

        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:https://device-care-360-admin-service.onrender.com}
          predicates:
            - Path=/api/admin/**
          filters:
            - AuthenticationFilter

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_HOST:device-care-360.railway.internal}:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: ${RAILWAY_PRIVATE_DOMAIN:${HOSTNAME:localhost}}
    instance-id: ${HOSTNAME:api-gateway}:${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.web.cors: DEBUG
    com.devicecare360.apigateway: DEBUG