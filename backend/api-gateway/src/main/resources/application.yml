server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "https://*.vercel.app"
              - "https://device-care-360.vercel.app"
              - "http://localhost:*"
            allowed-methods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "OPTIONS"
              - "PATCH"
            allowed-headers:
              - "*"
            exposed-headers:
              - "*"
            allow-credentials: true
            max-age: 3600
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
          filters:
            - AuthenticationFilter

        - id: device-service
          uri: lb://DEVICE-SERVICE
          predicates:
            - Path=/api/devices/**
          filters:
            - AuthenticationFilter

        - id: ai-troubleshooting-service
          uri: lb://AI-TROUBLESHOOTING-SERVICE
          predicates:
            - Path=/api/troubleshooting/**, /api/troubleshoot/**, /api/diagnose/**, /api/ai/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:device-care-360.railway.internal}:8761/eureka/
  instance:
    prefer-ip-address: true