server:
  port: ${PORT:8091}

spring:
  application:
    name: admin-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb+srv://devicecare_admin:admin1234@cluster0.sfssdaq.mongodb.net/admin_db?retryWrites=true&w=majority&appName=Cluster0}

eureka:
  instance:
    prefer-ip-address: true
    hostname: ${RAILWAY_PRIVATE_DOMAIN:${HOSTNAME:localhost}}
    instance-id: ${HOSTNAME:admin-service}:${spring.application.name}:${server.port}
    non-secure-port: ${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_HOST:device-care-360.railway.internal}:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics



