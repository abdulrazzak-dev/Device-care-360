server:
  port: 8083

spring:
  application:
    name: device-service
  data:
    mongodb:
      uri: mongodb+srv://devicecare_admin:admin1234@cluster0.sfssdaq.mongodb.net/device_db?retryWrites=true&w=majority&appName=Cluster0
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
