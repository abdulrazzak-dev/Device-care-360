version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: devicecare-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    mem_limit: 300m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  config-server:
    build: ./backend/config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx180m
    mem_limit: 300m

  discovery-service:
    build: ./backend/discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx180m
    mem_limit: 300m
    depends_on:
      - config-server

  api-gateway:
    build: ./backend/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx180m
      - EUREKA_HOST=discovery-service
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    mem_limit: 300m
    depends_on:
      - discovery-service

  auth-service:
    build: ./backend/auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx180m
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI_AUTH:-mongodb+srv://devicecare_admin:admin1234@cluster0.sfssdaq.mongodb.net/auth_db?retryWrites=true&w=majority&appName=Cluster0}
      - MONGODB_URI=${MONGODB_URI_AUTH:-mongodb+srv://devicecare_admin:admin1234@cluster0.sfssdaq.mongodb.net/auth_db?retryWrites=true&w=majority&appName=Cluster0}
      - RABBITMQ_HOST=rabbitmq
      - EUREKA_HOST=discovery-service
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    mem_limit: 300m
    depends_on:
      - rabbitmq
      - discovery-service

  user-service:
    build: ./backend/user-service
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx180m
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI_USER:-mongodb+srv://devicecare_admin:admin1234@cluster0.sfssdaq.mongodb.net/user_db?retryWrites=true&w=majority&appName=Cluster0}
      - MONGODB_URI=${MONGODB_URI_USER:-mongodb+srv://devicecare_admin:admin1234@cluster0.sfssdaq.mongodb.net/user_db?retryWrites=true&w=majority&appName=Cluster0}
      - RABBITMQ_HOST=rabbitmq
      - EUREKA_HOST=discovery-service
    mem_limit: 300m
    depends_on:
      - rabbitmq
